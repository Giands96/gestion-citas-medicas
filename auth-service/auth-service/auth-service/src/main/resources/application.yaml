server:
  port: ${SERVER_PORT:8081}

spring:
  flyway:
    enabled: true
    schemas: auth_service
    default-schema: auth_service
    locations: classpath:db/migration
    baseline-on-migrate: true
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5433/clinica_db?currentSchema=auth_service
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
        ddl-auto: create-drop
    show-sql: true
    properties:
        hibernate:
          format_sql: true
          default_schema: auth_service

jwt:
  secret: Zd2W3jBD8D2xFUSNPywUHDFeuFunANkdKKnaIQzFjbj
  expiration: 3600000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
